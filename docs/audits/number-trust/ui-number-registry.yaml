version: 2
seed_version: trusted-2026-04-27-v1
reference_date: 2026-04-28
view_states:
  - id: household
    view: household
    owner_id: null
    expected_state: populated
  - id: owner.quintin
    view: owner
    owner_id: quintin
    expected_state: populated
  - id: owner.amy
    view: owner
    owner_id: amy
    expected_state: payroll_only_no_account_balances
