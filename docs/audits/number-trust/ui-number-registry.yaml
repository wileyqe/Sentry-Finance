        formatter: integer
        display_precision: 1
        empty_state: "no_data"
        owner_scope: owner_aware
        selector: "[data-testid^='dashboard-credit-score-'], [data-testid='dashboard-credit-score-empty']"
        dom_builder: credit_score_multiselect
        audit_stage: api_oracle
        view_states: *all_views
