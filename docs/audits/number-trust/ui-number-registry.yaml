version: 2
seed_version: trusted-2026-04-27-v1
reference_date: 2026-04-28
view_states:
  - id: household
    view: household
    owner_id: null
    expected_state: populated
  - id: owner.quintin
    view: owner
    owner_id: quintin
    expected_state: populated
  - id: owner.amy
    view: owner
    owner_id: amy
    expected_state: payroll_only_no_account_balances
view_state_matrix: &all_views [household, owner.quintin, owner.amy]
investment_populated_views: &investment_populated_views [household, owner.quintin]
investment_empty_views: &investment_empty_views [owner.amy]
audit_stage_meanings:
  api_oracle: Oracle to API comparison is implemented in the audit harness.
  registered_pending: Visible value is registered; oracle, API, and DOM proof is pending.
surfaces:
  - id: dashboard.kpis
    page: Dashboard
    route: /dashboard
    values:
      - id: dashboard.net_worth.latest
        label: Net worth
        api: /api/reports/net-worth-history?months=6
        oracle: raw_latest_net_worth
        check_id: dashboard.net_worth.latest
        formatter: currency
        display_precision: 0.01
        empty_state: null
        owner_scope: owner_aware
        selector: "[data-testid='dashboard-net-worth-latest']"
        audit_stage: api_oracle
        view_states: *all_views
      - id: dashboard.monthly_net_flow
        label: Monthly net flow
        api: /api/reports/summary
        oracle: raw_report_summary
        check_id: dashboard.monthly_net_flow
        formatter: signed_currency
        display_precision: 0.01
        empty_state: null
        owner_scope: owner_aware
        selector: "[data-testid='dashboard-monthly-net-flow']"
        audit_stage: api_oracle
        view_states: *all_views
      - id: dashboard.emergency_runway
        label: Emergency runway
        api: /api/metrics/emergency-fund
        oracle: raw_emergency_fund
        check_id: dashboard.emergency_runway
        formatter: months_one_decimal
        display_precision: 0.1
        empty_state: null
        owner_scope: owner_aware
        selector: "[data-testid='dashboard-runway-months']"
        dom_builder: emergency_runway_summary
        audit_stage: api_oracle
        view_states: *all_views
      - id: dashboard.credit_scores.latest
