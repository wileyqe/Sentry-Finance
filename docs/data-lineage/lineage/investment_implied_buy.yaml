event_id: investment_implied_buy
label: "Investment implied buy (inferred from bank debit)"
class: user_action

origin:
  file: scripts/dummy_data/generator.py
  symbol: _generate_trusted_investment_account_history
  trigger: |
    Canonical trusted seed run. Monthly Acorns transfer rows allocate into
    IMPLIED_BUY rows because the bank-side debit implies a purchase without a
    confirming brokerage receipt.

write_signature:
  - table: positions_ledger
    operation: insert/update
    columns_set:
      - account_id
      - timestamp
      - ticker
      - transaction_type
      - share_delta
      - new_total_shares
      - yfinance_closing_price
      - estimated_transaction_value
      - bank_txn_id
      - cost_basis_dec
    notes: |
      Acorns uses VOO/IJH/IJR/IXUS allocation 55/15/15/15 at flat $100.00.
      One primary allocation row is linked to the cash debit; the other three
      are allocation detail.

  - table: transactions
    operation: update
    columns_set:
      - transfer_tag
      - investment_link
    notes: Links the Acorns cash debit to the primary implied-buy ledger row.

direct_consumers:
  - file: dal/reports/accountability.py
    symbol: _user_contributions_in_window
    reads:
      - positions_ledger.bank_txn_id
      - positions_ledger.estimated_transaction_value
    purpose: Counts one contribution per linked Acorns cash leg.

  - file: dal/investments.py
    symbol: get_lots
    reads:
      - positions_ledger.cost_basis_dec
      - positions_ledger.share_delta_dec
    purpose: Builds Acorns lot detail from formula cost basis.

derivations:
  - metric: contribution cardinality guard
    file: tests/test_trusted_seed.py
    symbol: test_trusted_investment_seed_is_round_and_explainable
    inputs:
      - positions_ledger.bank_txn_id
      - transactions.institution_txn_id
    output_location: trusted seed regression tests
    fan_out:
      - "Number-trust audit fixture"

ui_surfaces:
  - page: Dashboard
    component: frontend/src/pages/DashboardPage.tsx
    displays: Net worth includes Acorns portfolio total.
    via: "GET /api/reports/net-worth"

notes:
  - |
    The old canonical Acorns roundup and monthly-fee shapes are removed.
