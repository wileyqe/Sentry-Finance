event_id: equity_dividend
label: "Equity dividend payout"
class: external_force

origin:
  file: live/parser future path
  symbol: not emitted by canonical seed
  trigger: |
    A future brokerage parser may emit investment-account dividends. The
    canonical trusted seed emits zero investment-account dividend rows.

write_signature:
  - table: positions_ledger
    operation: live/future insert
    columns_set:
      - account_id
      - timestamp
      - ticker
      - transaction_type
      - share_delta
      - estimated_transaction_value
    notes: Production shape for an investment DIVIDEND ledger row.

  - table: transactions
    operation: live/future insert
    columns_set:
      - account_id
      - posting_date
      - amount
      - signed_amount
      - direction
      - description
      - category
      - institution_txn_id
    notes: Production cash-side Investment Income row if a parser emits it.

direct_consumers:
  - file: dal/flow_aggregation.py
    symbol: compute_period_totals
    reads:
      - transactions.category
      - transactions.signed_amount
    purpose: Future investment-income rows would affect income aggregates.

derivations: []
ui_surfaces:
  - page: Cash Flow
    component: frontend/src/pages/CashFlowPage.tsx
    displays: Future investment-income category rows.
    via: "GET /api/cash-flow/period"

notes:
  - |
    Ordinary deposit-account share dividends remain modeled as
    `bank_interest_credit`. This event refers only to investment-account equity
    dividends.
  - "Canonical trusted seed invariant: zero investment-account DIVIDEND rows."
