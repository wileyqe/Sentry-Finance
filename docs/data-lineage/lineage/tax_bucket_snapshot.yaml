event_id: tax_bucket_snapshot
label: "Tax bucket snapshot (TSP traditional / roth split)"
class: external_force

origin:
  file: scripts/dummy_data/generator.py
  symbol: _generate_trusted_investment_account_history
  trigger: |
    Canonical trusted seed run. TSP snapshots receive a fixed tax-bucket split
    at every canonical investment snapshot date.

write_signature:
  - table: tax_buckets
    operation: insert_or_replace
    columns_set:
      - account_id
      - bucket_type
      - balance
      - vested_pct
      - as_of
    notes: |
      Canonical split is fixed: 35% traditional and 65% roth. Bucket balances
      are integer cents and sum exactly to the TSP portfolio total at `as_of`.

direct_consumers:
  - file: dal/investments.py
    symbol: get_tax_buckets / get_tax_summary
    reads:
      - tax_buckets.bucket_type
      - tax_buckets.balance
      - tax_buckets.vested_pct
      - tax_buckets.as_of
    purpose: Mixed-tax TSP breakdown for investment tax-summary APIs.

derivations:
  - metric: tax bucket invariant
    file: tests/test_trusted_seed.py
    symbol: test_trusted_investment_seed_is_round_and_explainable
    inputs:
      - tax_buckets.balance
      - portfolio_snapshots.total_account_value
    output_location: trusted seed regression tests
    fan_out:
      - "Number-trust audit fixture"

ui_surfaces:
  - page: Accounts
    component: frontend/src/pages/AccountsPage.tsx
    displays: TSP account value through net worth APIs; tax buckets remain investment-page detail.
    via: "GET /api/reports/net-worth-history"

notes:
  - "Canonical row count: 76 tax_buckets rows (38 dates x 2 buckets)."
  - |
    Live TSP parser currently has a different placeholder/fallback tax-bucket
    behavior. The fixed 35/65 split is synthetic proof-fixture data, not a live
    allocation claim.
