event_id: investment_holdings_snapshot
label: "Investment holdings snapshot"
class: external_force

origin:
  file: scripts/dummy_data/generator.py
  symbol: _generate_trusted_investment_account_history
  trigger: |
    Canonical trusted seed run. The helper writes holdings at the same 38 dates
    used for portfolio snapshots.
  live_fidelity:
    file: dal/fidelity_investment_writes.py
    symbol: write_fidelity_investment_state
    trigger: |
      Fidelity CSV ingest passes reconstructed daily snapshots through the
      source-specific writer. SPAXX/FDRXX stay in portfolio cash, and
      cost-basis fields remain unclaimed for P17-T30.

write_signature:
  - table: investment_holdings
    operation: insert_or_replace
    columns_set:
      - account_id
      - date
      - ticker
      - shares
      - close_price
      - market_value
      - cost_basis
    notes: |
      Canonical invariant: `close_price = 100.0` and `market_value ==
      cost_basis == shares * close_price` for every seeded holding row.

direct_consumers:
  - file: dal/investments.py
    symbol: get_holdings
    reads:
      - investment_holdings.ticker
      - investment_holdings.shares
      - investment_holdings.close_price
      - investment_holdings.market_value
      - investment_holdings.cost_basis
      - ticker_metadata.asset_class
    purpose: Current investment holdings response.

  - file: dal/investments.py
    symbol: get_allocation
    reads:
      - investment_holdings.market_value
      - ticker_metadata.sector
      - ticker_metadata.asset_class
    purpose: Allocation and asset-class grouping.

  - file: dal/reports/net_worth.py
    symbol: get_net_worth_components fallback
    reads:
      - investment_holdings.market_value
    purpose: Alternate investment value source when portfolio snapshots are unavailable.

derivations:
  - metric: holdings value invariant
    file: tests/test_trusted_seed.py
    symbol: test_trusted_investment_seed_is_round_and_explainable
    inputs:
      - investment_holdings.market_value
      - investment_holdings.cost_basis
      - investment_holdings.shares
      - investment_holdings.close_price
    output_location: trusted seed regression tests
    fan_out:
      - "Number-trust audit fixture"

ui_surfaces:
  - page: Accounts
    component: frontend/src/pages/AccountsPage.tsx
    displays: Investment balances via net worth APIs.
    via: "GET /api/reports/net-worth-history"

notes:
  - "Canonical row count: 570 investment_holdings rows."
