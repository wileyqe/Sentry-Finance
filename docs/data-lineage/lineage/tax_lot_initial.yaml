event_id: tax_lot_initial
label: "Initial tax-lot baseline"
class: system_derived

origin:
  file: scripts/dummy_data/generator.py
  symbol: _generate_trusted_investment_account_history
  trigger: |
    Canonical trusted seed run. Each investment ticker receives one
    `INITIAL_BASELINE` row on the seed start date.

write_signature:
  - table: positions_ledger
    operation: insert
    columns_set:
      - account_id
      - timestamp
      - ticker
      - transaction_type
      - share_delta
      - new_total_shares
      - yfinance_closing_price
      - estimated_transaction_value
      - cost_basis_dec
    notes: |
      Canonical baseline uses the round starting account balance allocated by
      ticker at the flat $100.00 fixture price. Cost basis equals market value.

direct_consumers:
  - file: dal/investments.py
    symbol: get_lots
    reads:
      - positions_ledger.transaction_type
      - positions_ledger.cost_basis_dec
      - positions_ledger.share_delta_dec
    purpose: Builds lot detail from baseline rows.

derivations:
  - metric: initial investment balance
    file: scripts/dummy_data/generator.py
    symbol: _generate_trusted_investment_account_history
    inputs:
      - positions_ledger.estimated_transaction_value
    output_location: first portfolio and holdings snapshots
    fan_out:
      - "Dashboard and Accounts net worth investment component"

ui_surfaces:
  - page: Accounts
    component: frontend/src/pages/AccountsPage.tsx
    displays: Starting investment balance in net worth history.
    via: "GET /api/reports/net-worth-history"

notes:
  - "Canonical INITIAL_BASELINE count: 15 rows (4 Acorns + 8 Fidelity + 3 TSP)."
