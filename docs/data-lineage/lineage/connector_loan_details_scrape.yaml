event_id: connector_loan_details_scrape
label: "Connector loan-details scrape (live)"
class: live_only

origin:
  file: backend/result_writer.py
  symbol: persist_connector_result (loan_details branch, line 229-264)
  trigger: |
    Live only — fired by `persist_connector_result` for each entry
    in `result.loan_details`. Special-cases the `apy` key: pops it
    out of the per-account dict and routes it to
    `dal.apy_history.record_apy_history` with `source='scrape'`,
    then writes the rest of the dict to `loan_details` via
    `dal.balances.record_loan_details`. Per CLAUDE.md
    "P15-T04 Phase B" comment at line 226-228.

write_signature:
  - table: apy_history
    operation: insert (INSERT OR IGNORE on (account_id, as_of, source))
    columns_set: [account_id, apy_rate, as_of, source]
    notes: |
      Only when the connector's loan_details dict contains an
      `apy` key. `apy_raw = details.pop("apy", None)` at line 234,
      then `parse_apy_string(apy_raw)` (line 237) →
      `record_apy_history(conn, account_id=..., apy_rate=...,
      as_of=today_iso, source="scrape")` at line 238-244.
      `today_iso = datetime.now().date().isoformat()` (line 230)
      so all APY rows from the same call share the same date.
      Invalid APY strings (`ValueError` from `parse_apy_string`)
      are caught and logged at line 251-256; the row is skipped
      but the rest of `loan_details` proceeds.

  - table: loan_details
    operation: insert (per-field append; NO UNIQUE constraint)
    columns_set: [account_id, field_name, field_value, as_of, refresh_run_id]
    notes: |
      `record_loan_details(conn, account_id, details, now)` at
      line 259, but ONLY when `if details:` (line 258) — i.e. if
      the dict is empty after the `apy` pop, the loan_details
      write is skipped entirely. The KV writer iterates the dict
      and inserts one row per `(field_name, field_value)` pair;
      see `dal/balances.py:169-209` for the write loop.

      ✅ AI-034 FIXED 2026-04-26 (cross-link
      `connector_balance_scrape.yaml`): `persist_connector_result`
      now passes `refresh_run_id` as the 5th positional argument
      to `record_loan_details`, populated by the orchestrator's
      `RefreshSession.run_id` via `_run_with_timeout`. The
      `loan_details.refresh_run_id` column is populated for every
      live loan-details write.

