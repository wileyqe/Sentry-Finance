event_id: dev_advance_dummy_data
label: "Dev: advance dummy data (re-seed)"
class: live_only

origin:
  file: backend/routers/dev.py
  symbol: advance_dummy_data (line 49)
  trigger: |
    Live only — `POST /api/dev/advance-dummy-data`. Computes
    the next end_date as
    `min(max(current data date, today-2)+1, today)` then
    invokes `scripts/seed_dummy_data.py --end-date NEW_END`
    via subprocess. Local-dev convenience to nudge the
    rolling 3-year synthetic window forward without
    restarting the API server. **Should NOT be exposed in any
    deployed build** (per the file's module docstring).

write_signature:
  - table: ALL writable tables (entire seeder)
    operation: re-seed (DELETEs + INSERTs across the schema)
    columns_set: ["entire schema rewritten via the rolling seeder"]
    notes: |
      The seeder regenerates the trailing 3-year window so
      balances, transactions, recurring patterns, credit
      scores, snapshots, ticker metadata, etc. all advance
      together. Each table's writer behavior is documented
      in the per-event YAMLs (paycheck, mortgage_payment,
      investment_contribution, balance_snapshot,
      portfolio_snapshot, apy_rate_snapshot,
      credit_score_reading, vehicle_valuation,
      real_estate_valuation, payroll_snapshot, etc.).
      DO NOT re-enumerate per table here — this event is
      the COLLECTIVE wrapper. Per
      `events.yaml > dev_advance_dummy_data`: "Side effect
      of every other event in this file collectively."

direct_consumers: []

derivations: []

ui_surfaces:
  - page: Settings → Dev tools (inferred)
    component: (no specific component traced)
    displays: |
      "Advance Dummy Data" button somewhere in the dev
      tooling section of the UI. Calls
      `POST /api/dev/advance-dummy-data` and the broadcast
      `REFRESH_COMPLETE` SSE now reaches RefreshBanner
      (AI-032 fixed 2026-04-26), firing the
      `onRefreshComplete` callback so consumer pages
      auto-refetch. The no-op path (line 71-85) also
      broadcasts the SSE so the click "feels responsive"
      as originally intended.
    via: "POST /api/dev/advance-dummy-data"

forecast_impact: []
  # The seeder regenerates the rolling window, so forecasts
  # implicitly advance with the new data.

external_effects:
  - "Subprocess invocation of `python scripts/seed_dummy_data.py --end-date YYYY-MM-DD` (line 100-105). Runs synchronously (not async) — the API request blocks until the seeder completes (typically 5-30 seconds depending on dataset size)."
  - "Per-call INFO log line `Dev advance: re-seeding rolling window with end_date=%s (was %s)` (line 87-92)."
  - "On seeder failure: ERROR log includes last 2000 chars of stdout + stderr, then HTTP 500 with exit code (line 106-116)."
  - "On success OR no-op: SSE `refresh_complete` topic broadcast with payload `{trigger: 'dev_advance_dummy_data', advanced_to, previous_max, no_op?}`."

inferred_edges:
  - |
    The synchronous-subprocess pattern blocks the FastAPI
    worker for the duration of the seeder. With Uvicorn's
    default single-worker dev configuration, this means the
    UI is unresponsive during the re-seed. A future
    background-thread version (parallel to the
    `_run_in_thread` pattern in `routers/refresh.py:72-82`)
    would let the UI keep moving while the seeder runs.

  - |
    The no-op path (line 71-85) still broadcasts the SSE
    "so the click should still feel responsive". This
    intentionally fires `REFRESH_COMPLETE` with `no_op=True`
    in the payload — frontend consumers should branch on
    that flag if they want to distinguish a real advance
    from a no-op.

    Cross-link AI-032 (FIXED 2026-04-26) — `REFRESH_COMPLETE`
    SSE now reaches RefreshBanner via `addEventListener`,
    so the "feel responsive" no-op broadcast and the
    consumer-page auto-refetch on real advances both work
    as originally intended.

  - |
    `_current_max_data_date` reads `MAX(posting_date) FROM
    transactions` and falls back to "today minus 2 days" if
    empty. A fresh DB with no transactions calls the
    fallback. This is fine for local dev but worth knowing.

runtime_confirmed_edges: []

notes:
  - |
    The seeder is `scripts/seed_dummy_data.py`. The deprecated
    `scripts/seed_dummy_db.py` (a leftover JSON-file seeder) was
    deleted 2026-04-26 per AI-013, so the underscore-vs-no-underscore
    foot-gun is gone — there is now only one seeder script.

  - |
    Cross-link `connector_refresh_lifecycle.yaml` for the
    `REFRESH_COMPLETE` SSE topic mechanics, AI-032 for why
    the broadcast doesn't reach the UI today.

  - |
    Listed for completeness so the inverse index (Phase 3)
    can reach this event. Per events.yaml, "Side effect of
    every other event in this file collectively" — the
    inverse index will trace this to a fan-out across the
    full per-event lineage map.

  - |
    Hard guardrail per file docstring (line 1-6): "they
    should NOT be exposed in any deployed build." A
    production-mode flag check is NOT visible at the
    endpoint level (no environment / debug-mode gate). The
    safety relies on the API server being a local-only
    deployment. AI candidate if the user ever ships to a
    multi-tenant context.
