event_id: dividend_reinvestment
label: "Dividend reinvestment"
class: external_force

origin:
  file: live/parser future path
  symbol: not emitted by canonical seed
  trigger: |
    A future brokerage parser may emit reinvested dividend purchases. The
    canonical trusted seed emits zero REINVESTMENT rows.

write_signature:
  - table: positions_ledger
    operation: live/future insert
    columns_set:
      - account_id
      - timestamp
      - ticker
      - transaction_type
      - share_delta
      - cost_basis_dec
      - settlement_date
    notes: Production shape only; not canonical synthetic seed output.

direct_consumers:
  - file: dal/reports/flow.py
    symbol: _compute_reinvestment_flows
    reads:
      - positions_ledger.transaction_type
      - positions_ledger.estimated_transaction_value
    purpose: Future reinvestment flow attribution.

derivations: []
ui_surfaces:
  - page: Cash Flow
    component: frontend/src/pages/CashFlowPage.tsx
    displays: Future reinvestment flow if registered and rendered.
    via: "GET /api/cash-flow/period"

notes:
  - "Canonical trusted seed invariant: zero rows where positions_ledger.transaction_type = 'REINVESTMENT'."
