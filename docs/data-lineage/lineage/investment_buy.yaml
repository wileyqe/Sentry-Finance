event_id: investment_buy
label: "Investment buy (confirmed security purchase)"
class: user_action

origin:
  file: scripts/dummy_data/generator.py
  symbol: _generate_trusted_investment_account_history
  trigger: |
    Canonical trusted seed run. Baseline rows establish starting holdings;
    monthly Fidelity and TSP transfers allocate into BUY rows at the flat
    trusted fixture price.

write_signature:
  - table: positions_ledger
    operation: insert
    columns_set:
      - account_id
      - timestamp
      - ticker
      - transaction_type
      - share_delta
      - new_total_shares
      - yfinance_closing_price
      - estimated_transaction_value
      - share_delta_dec
      - new_total_shares_dec
      - bank_txn_id
      - cost_basis_dec
      - realized_gain_dec
      - settlement_date
      - commission_dec
      - fees_dec
    notes: |
      Canonical BUY rows exist for Fidelity and TSP monthly transfers. The
      first row per ticker is `INITIAL_BASELINE`, not BUY. There are no random
      buys, sells, dividends, reinvestments, or SPAXX cash-sweep rows.

direct_consumers:
  - file: dal/investments.py
    symbol: get_lots
    reads:
      - positions_ledger.transaction_type
      - positions_ledger.share_delta_dec
      - positions_ledger.cost_basis_dec
    purpose: Builds current lots and cost-basis detail from positive-share rows.

  - file: dal/investments.py
    symbol: get_holdings fallback
    reads:
      - positions_ledger.new_total_shares_dec
      - benchmark_prices.close_price
    purpose: Fallback position reconstruction if `investment_holdings` is stale.

derivations:
  - metric: investment holdings formula
    file: scripts/dummy_data/generator.py
    symbol: _generate_trusted_investment_account_history
    inputs:
      - positions_ledger.estimated_transaction_value
      - benchmark_prices.close_price
    output_location: investment_holdings and portfolio_snapshots
    fan_out:
      - "Accounts net worth investment component"
      - "Dashboard net worth KPI"

ui_surfaces:
  - page: Accounts
    component: frontend/src/pages/AccountsPage.tsx
    displays: Investment account balances derived from latest snapshots.
    via: "GET /api/reports/net-worth-history"

notes:
  - |
    Live statement-confirmed BUY support remains a separate production concern.
    The canonical proof fixture uses deterministic formula rows only.
