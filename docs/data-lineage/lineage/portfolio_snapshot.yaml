event_id: portfolio_snapshot
label: "Portfolio snapshot (account-level total)"
class: external_force

origin:
  file: scripts/dummy_data/generator.py
  symbol: _generate_trusted_investment_account_history
  trigger: |
    Canonical trusted seed run. The helper writes seed-start, monthly
    contribution-date, and canonical-end snapshots for each investment account.

write_signature:
  - table: portfolio_snapshots
    operation: insert
    columns_set:
      - account_id
      - timestamp
      - total_account_value
      - cash_balance
    notes: |
      Canonical formula: `total_account_value = starting_balance + monthly_cents
      * contributions_through(snapshot_date)`. `cash_balance = 0.0` for every
      canonical investment snapshot.

direct_consumers:
  - file: dal/reports/net_worth.py
    symbol: get_net_worth_components / get_net_worth_history
    reads:
      - portfolio_snapshots.total_account_value
      - portfolio_snapshots.timestamp
    purpose: Investment component of Dashboard and Accounts net worth.

  - file: dal/investments.py
    symbol: get_holdings / get_performance / get_allocation
    reads:
      - portfolio_snapshots.total_account_value
      - portfolio_snapshots.cash_balance
      - portfolio_snapshots.timestamp
    purpose: Investment account totals, cash leg, and performance series.

derivations:
  - metric: investment_cents
    file: dal/reports/net_worth.py
    symbol: get_net_worth_components
    inputs:
      - portfolio_snapshots.total_account_value
    output_location: net worth payload investment component
    fan_out:
      - "Dashboard net worth KPI"
      - "Accounts net worth chart"

  - metric: investment market-value delta
    file: dal/reports/accountability.py
    symbol: get_accountability
    inputs:
      - portfolio_snapshots.total_account_value
    output_location: Reports accountability investment row
    fan_out:
      - "Reports page"
    notes: |
      In the canonical seed, deltas are contribution-driven only. Market gain
      should be zero unless production logic introduces a definition mismatch.

ui_surfaces:
  - page: Dashboard
    component: frontend/src/pages/DashboardPage.tsx
    displays: Net worth KPI includes latest investment totals.
    via: "GET /api/reports/net-worth"

  - page: Accounts
    component: frontend/src/pages/AccountsPage.tsx
    displays: Net worth history and investment account totals.
    via: "GET /api/reports/net-worth-history"

notes:
  - "Canonical row count: 114 portfolio_snapshots (38 dates x 3 accounts)."
