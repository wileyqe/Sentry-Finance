event_id: market_price_tick
label: "Market price tick (trusted fixture close)"
class: external_force

origin:
  file: scripts/dummy_data/generator.py
  symbol: _fetch_and_cache_prices + _fallback_flat_prices
  trigger: |
    Canonical trusted seed run. The seed path disables live yFinance/network
    input and writes flat $100.00 prices for every investment ticker/trading day.

write_signature:
  - table: benchmark_prices
    operation: insert_or_ignore
    columns_set:
      - ticker
      - price_date
      - close_price
    notes: |
      Canonical fixture prices are flat, not drifting. `close_price` is always
      100.0 for trusted investment tickers in the seed window.

direct_consumers:
  - file: dal/investments.py
    symbol: get_holdings / get_lots fallback
    reads:
      - benchmark_prices.close_price
    purpose: Fallback current-price lookup if holdings snapshots are stale.

  - file: scripts/dummy_data/generator.py
    symbol: _generate_trusted_investment_account_history
    reads:
      - benchmark_prices.close_price
    purpose: Keeps holdings/ledger table shape consistent with fixture prices.

derivations:
  - metric: formula holding value
    file: scripts/dummy_data/generator.py
    symbol: _generate_trusted_investment_account_history
    inputs:
      - benchmark_prices.close_price
      - investment_holdings.shares
    output_location: investment_holdings.market_value
    fan_out:
      - "Accounts and Dashboard net worth investment component"

ui_surfaces:
  - page: Accounts
    component: frontend/src/pages/AccountsPage.tsx
    displays: Investment balances derived from fixture-priced snapshots.
    via: "GET /api/reports/net-worth-history"

notes:
  - |
    Live TSP price updates may still overwrite TSP benchmark rows outside the
    canonical proof workflow. Proof runs should reseed and assert the manifest
    fingerprint before trusting values.
