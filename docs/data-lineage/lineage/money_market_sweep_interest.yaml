event_id: money_market_sweep_interest
label: "Money-market sweep interest (SPAXX)"
class: external_force

origin:
  file: live/parser future path
  symbol: not emitted by canonical seed
  trigger: |
    A future Fidelity parser may emit SPAXX sweep interest. The canonical
    trusted seed has no SPAXX cash position and emits zero SPAXX DIVIDEND rows.

write_signature:
  - table: positions_ledger
    operation: live/future insert
    columns_set:
      - account_id
      - timestamp
      - ticker
      - transaction_type
      - estimated_transaction_value
    notes: Production shape only; not canonical synthetic seed output.

  - table: transactions
    operation: live/future insert
    columns_set:
      - account_id
      - posting_date
      - amount
      - signed_amount
      - category
      - description
    notes: Future cash-side Investment Income row if parser emits it.

direct_consumers:
  - file: dal/investments.py
    symbol: get_holdings
    reads:
      - portfolio_snapshots.cash_balance
    purpose: Current cash balance still comes from portfolio snapshots, not SPAXX rows.

derivations: []
ui_surfaces:
  - page: Investments / Holdings
    component: frontend/src/pages/InvestmentsHoldings.tsx
    displays: Future brokerage cash balance if live parser adds it.
    via: "GET /api/investments/holdings"

notes:
  - "Canonical trusted seed invariant: zero SPAXX DIVIDEND transaction or ledger rows."
