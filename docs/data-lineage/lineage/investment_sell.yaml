event_id: investment_sell
label: "Investment sell (security sale)"
class: user_action

origin:
  file: live/parser future path
  symbol: not emitted by canonical seed
  trigger: |
    A future brokerage parser may emit SELL rows. The canonical trusted seed
    emits zero SELL rows.

write_signature:
  - table: positions_ledger
    operation: live/future insert
    columns_set:
      - account_id
      - timestamp
      - ticker
      - transaction_type
      - share_delta
      - cost_basis_dec
      - realized_gain_dec
      - settlement_date
    notes: |
      This signature documents the production shape. It is not part of the
      canonical synthetic proof fixture.

direct_consumers:
  - file: dal/investments.py
    symbol: get_lots
    reads:
      - positions_ledger.transaction_type
      - positions_ledger.realized_gain_dec
    purpose: Future SELL rows reduce lots and expose realized gain.

derivations: []
ui_surfaces:
  - page: Investments / Holdings
    component: frontend/src/pages/InvestmentsHoldings.tsx
    displays: Future lot detail may show SELL effects.
    via: "GET /api/investments/lots"

notes:
  - "Canonical trusted seed invariant: zero rows where positions_ledger.transaction_type = 'SELL'."
