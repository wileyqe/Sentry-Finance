event_id: investment_contribution
label: "Investment contribution (cash leg)"
class: user_action

origin:
  file: scripts/dummy_data/generator.py
  symbol: generate_transactions + _generate_trusted_investment_account_history
  trigger: |
    Canonical trusted seed run. `generate_transactions` emits one monthly
    bank-side debit per investment account; the trusted investment helper links
    that debit to one primary `positions_ledger` row.

write_signature:
  - table: transactions
    operation: insert
    columns_set:
      - id
      - account_id
      - institution_id
      - posting_date
      - transaction_date
      - amount
      - signed_amount
      - direction
      - description
      - category
      - status
      - raw_description
      - institution_txn_id
      - transfer_tag
      - investment_link
    notes: |
      Canonical instances are `ACORNS INVEST TRANSFER` ($500/mo),
      `FIDELITY EFT TRANSFER` ($1,000/mo), and `TSP CONTRIBUTION TRANSFER`
      ($1,500/mo), all debiting `summit_chk`. The linked transfer tag makes
      these contribution rows disappear from ordinary spending aggregates.

  - table: positions_ledger
    operation: insert/update
    columns_set:
      - id
      - account_id
      - timestamp
      - ticker
      - transaction_type
      - share_delta
      - new_total_shares
      - yfinance_closing_price
      - estimated_transaction_value
      - share_delta_dec
      - new_total_shares_dec
      - bank_txn_id
      - cost_basis_dec
      - settlement_date
      - commission_dec
      - fees_dec
    notes: |
      One primary allocation row per account/month receives `bank_txn_id`.
      Sibling allocation rows on the same date are intra-account detail and
      must not be counted as additional user contributions.

direct_consumers:
  - file: dal/transactions.py
    symbol: get_transactions
    reads:
      - transactions.*
    purpose: Transactions list shows the cash-side contribution debit.

  - file: dal/investments.py
    symbol: get_activity
    reads:
      - transactions.investment_link
      - transactions.transfer_tag
      - positions_ledger.bank_txn_id
    purpose: Investment account activity can show linked contribution rows.

derivations:
  - metric: cash-flow transfer exclusion
    file: dal/flow_aggregation.py
    symbol: compute_period_totals
    inputs:
      - transactions.signed_amount
      - transactions.transfer_tag
      - transactions.category
    output_location: spending and net-flow aggregates
    fan_out:
      - "Dashboard monthly net flow"
      - "Cash Flow period totals"
    notes: |
      Contribution cash legs are intentionally excluded from spending by
      `transfer_tag IS NOT NULL`.

  - metric: investment contribution attribution
    file: dal/reports/accountability.py
    symbol: _user_contributions_in_window
    inputs:
      - transactions.investment_link
      - positions_ledger.bank_txn_id
      - positions_ledger.estimated_transaction_value
    output_location: accountability contribution math
    fan_out:
      - "Reports accountability investment row"

ui_surfaces:
  - page: Transactions
    component: frontend/src/pages/TransactionsPage.tsx
    displays: Investment transfer rows in the transaction table.
    via: "GET /api/transactions"

  - page: Cash Flow
    component: frontend/src/pages/CashFlowPage.tsx
    displays: Period totals that exclude tagged investment transfers from spending.
    via: "GET /api/cash-flow/period"

notes:
  - |
    Canonical seed removed Acorns roundups, Acorns monthly fees, and Fidelity
    ledger-only SPAXX DEPOSIT contributions. Those shapes may return later only
    through live-data-specific parsing or separately audited fixtures.
