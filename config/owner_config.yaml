# ─────────────────────────────────────────────────────────────────
# owner_config.yaml — Ownership configuration for dashboard views
# ─────────────────────────────────────────────────────────────────
#
# Defines the canonical owner roster for the dashboard's
# Quintin / Household / Amy switcher. Local-first, no login system.
#
# All ids must be lowercase (enforced by migration v21 and the
# resolver in dal/owners.py).
# ─────────────────────────────────────────────────────────────────

# Who is "me" when the dashboard defaults a view?
primary_owner: "quintin"

# All known owners — seeded into the owners table on init.
# Amy is currently a structural placeholder (no synthetic data
# attached); she keeps the switcher at three buttons and will
# accept real banking once the ingestion pipeline is wired up.
owners:
  - id: "quintin"
    display_name: "Quintin"
  - id: "amy"
    display_name: "Amy"
