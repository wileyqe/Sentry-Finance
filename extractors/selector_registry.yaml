mypay:
  # P17-T25 foundation: selectors are seeded conservatively — DFAS
  # rotates form ids occasionally and these have NOT been verified
  # against a live myPay session yet. The DOM Healer / AI backstop
  # will firm them up on the first successful run.
  login:
    username:
      intent: "Username input on myPay login page (mypay.dfas.mil)"
      selectors:
        - 'input#LoginUserName'
        - 'input#username'
        - 'input[name="username"]'
        - 'input[name="UserName"]'
        - 'input[autocomplete="username"]'
    password:
      intent: "Password input on myPay login page"
      selectors:
        - 'input#LoginPassword'
        - 'input#password'
        - 'input[name="password"]'
        - 'input[type="password"]'
    submit:
      intent: "Login submit button on myPay login page"
      selectors:
        - 'button[type="submit"]'
        - 'input[type="submit"]'
        - '#LoginButton'
        - 'button:has-text("Login")'
        - 'button:has-text("Sign In")'

  mfa:
    email_factor:
      intent: "Email MFA factor choice on myPay second-factor method screen"
      selectors:
        - 'input[type="radio"][name="optin"]'
        - 'input[type="radio"][value*="email" i]'
        - 'input[type="radio"][aria-label*="email" i]'
        - '[role="radio"][aria-label*="email" i]'
    factor_next:
      intent: "Next button after choosing a myPay MFA factor"
      selectors:
        - 'button:has-text("Next")'
        - 'input[type="submit"][value*="Next" i]'
        - 'button[type="submit"]'
    code_input:
      intent: "Email-delivered OTP code input on myPay second-factor screen"
      selectors:
        - 'input#onetimepin'
        - 'input[aria-label*="One-Time PIN" i]'
        - 'input[aria-label*="One Time PIN" i]'
        - 'input[autocomplete="one-time-code"]'
        - 'input[name="code"]'
        - 'input[name="otp"]'
        - 'input[name="passcode"]'
        - 'input[name="securityCode"]'
        - 'input[id*="code" i]'
        - 'input[id*="otp" i]'
    submit:
      intent: "Verify / Submit button on myPay second-factor screen"
      selectors:
        - 'button[type="submit"]'
        - 'input[type="submit"]'
        - 'button:has-text("Verify")'
        - 'button:has-text("Submit")'
        - 'button:has-text("Continue")'

  post_login:
    password_change_later:
      intent: "Defer the periodic myPay password-change prompt while surfacing an app notification"
      selectors:
        - 'button:has-text("Remind Me Later")'
        - 'input[type="button"][value*="Remind Me Later" i]'
        - 'a:has-text("Remind Me Later")'
    message_continue:
      intent: "Continue / accept control on post-login myPay message interstitial"
      selectors:
        - 'button:has-text("I agree to the terms of the User Agreement")'
        - 'button:has-text("Continue")'
        - 'button:has-text("Accept")'
        - 'button:has-text("I Agree")'
        - 'button:has-text("Agree")'
        - 'button:has-text("OK")'
        - 'a:has-text("Continue")'
        - 'a:has-text("Accept")'
        - 'input[type="submit"]'

  ras:
    section_link:
      intent: "Link to the Retiree Account Statement (RAS) section after login"
      selectors:
        - 'a[href="#/militaryretired/mras"]'
        - 'a:has-text("Monthly Retiree Account Statement")'
        - 'a:has-text("eRAS")'
        - 'a:has-text("Retiree Account Statement")'
